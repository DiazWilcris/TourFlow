{% extends 'base.html' %}

{% block title %}Iniciar sesión | TourFlow{% endblock %}

{% block content %}
  <div class="row justify-content-center pt-md-5">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow border-0">
        <div class="card-body p-4 p-md-5">
          <h1 class="h3 text-center fw-bold mb-1">Bienvenido a TourFlow</h1>
          <p class="text-muted text-center mb-4">Ingresa para gestionar tus giras.</p>

          <form method="post" id="login-form" novalidate>
            <div class="mb-3">
              <label class="form-label" for="username">Usuario</label>
              <input class="form-control" id="username" name="username" maxlength="50" required autocomplete="username">
            </div>
            <div class="mb-4">
              <label class="form-label" for="password">Contraseña</label>
              <input class="form-control" id="password" name="password" type="password" required autocomplete="current-password">
            </div>
            <button class="btn btn-primary w-100" id="login-submit" type="submit">Iniciar sesión</button>
          </form>

          <p class="small text-muted text-center mt-4 mb-0">
            Demo: <code>organizador</code> / <code>TourFlow123!</code>
          </p>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
